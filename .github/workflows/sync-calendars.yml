# Hourly sync of booked dates from Airbnb calendars into data/availability.json.
# Setup (once, on github.com):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: CALENDAR_URLS
#      Value: {"curtis-park": "https://www.airbnb.com/calendar/ical/....ics?t=...", "mountain-view": "..."}
#   2. Optional variable SITE_BRANCH = the branch the website is published from (default: gh-pages)
# Scheduled workflows only run from the repository's default branch, so this file must also exist on main.
name: Sync Airbnb calendars

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:       # "Run workflow" button for an immediate sync

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SITE_BRANCH || 'gh-pages' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Airbnb calendars
        env:
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
        run: python3 tools/sync_calendars.py || echo "::warning::One or more calendars could not be fetched; previous dates were kept."

      - name: Publish updated dates
        run: |
          if git diff --quiet -- data/availability.json; then
            echo "No change in booked dates."
            exit 0
          fi
          git config user.name "calendar-sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git add data/availability.json
          git commit -m "Sync booked dates from Airbnb"
          git push
